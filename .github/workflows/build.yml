name: APK
on:
  push:
    branches-ignore: [emulator]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Sabit imza anahtarı
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_IN: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/anahtar.p12"
            echo "KS_PATH=$RUNNER_TEMP/anahtar.p12" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASS_IN" >> "$GITHUB_ENV"
          else
            echo "UYARI: KEYSTORE_B64 secret'ı yok, geçici anahtarla imzalanıyor (güncelleme üstüne kurulmaz)."
          fi
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/*.apk subplay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SubPlay-apk
          path: subplay.apk
      - name: Sürüm numarası (surum.txt)
        id: surum
        run: echo "no=$(tr -d '[:space:]' < surum.txt)" >> "$GITHUB_OUTPUT"
      - name: Sürüm notu (commit mesajı, imza satırları hariç)
        id: not
        run: |
          {
            echo "metin<<SURUMNOTU_SONU"
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo "SURUMNOTU_SONU"
          } >> "$GITHUB_OUTPUT"
      # Sadece ana dal (main) yayınlanır; diğer dallar yalnızca derlenip kontrol edilir
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.surum.outputs.no }}
          name: Sürüm ${{ steps.surum.outputs.no }}
          body: ${{ steps.not.outputs.metin }}
          files: subplay.apk
          make_latest: true
